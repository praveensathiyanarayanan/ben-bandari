<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sovereignGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4"/>
      <stop offset="45%" stop-color="#DFC282"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A772D"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Tile -->
  <rect width="64" height="64" rx="14" fill="#0E0E0E"/>

  <!-- Inset Metallic Gold Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="10.5" fill="none" stroke="url(#sovereignGold)" stroke-width="1.8"/>

  <!-- Sovereign Diamond Crest -->
  <polygon points="32,9 37.5,15.5 32,22 26.5,15.5" fill="url(#sovereignGold)" filter="url(#goldGlow)"/>

  <!-- Monogram BB -->
  <text x="32" y="48" font-family="'Cinzel', 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="1.5" fill="url(#sovereignGold)" text-anchor="middle">BB</text>

  <!-- Subtle Micro Baseline Accent -->
  <line x1="22" y1="53" x2="42" y2="53" stroke="url(#sovereignGold)" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
</svg>
