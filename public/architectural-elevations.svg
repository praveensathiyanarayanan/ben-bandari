<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" fill="none" stroke="#4A3425" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="archGridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#4A3425" stroke-width="0.4" opacity="0.12" />
      <line x1="0" y1="0" x2="0" y2="60" stroke="#4A3425" stroke-width="0.4" opacity="0.12" />
      <circle cx="0" cy="0" r="1.5" fill="#4A3425" opacity="0.2" />
    </pattern>
    <pattern id="diagHatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4A3425" stroke-width="0.6" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Drafting Grid Across Canvas -->
  <rect width="100%" height="100%" fill="url(#archGridPattern)" />

  <!-- LEFT QUADRANT: Contemporary Architectural Pavilion Elevation & Section -->
  <g opacity="0.45" stroke-width="0.9">
    <!-- Ground Datum & Foundation Line -->
    <line x1="40" y1="580" x2="650" y2="580" stroke-width="1.8" />
    <line x1="40" y1="588" x2="650" y2="588" stroke-width="1.2" />
    
    <!-- Left Villa Facade Elevation -->
    <!-- Concrete Overhang Roof -->
    <rect x="70" y="380" width="380" height="14" fill="url(#diagHatch)" stroke-width="1.6" />
    <rect x="90" y="460" width="340" height="10" stroke-width="1.4" />
    
    <!-- Vertical Structural Columns -->
    <line x1="110" y1="394" x2="110" y2="580" stroke-width="2" />
    <line x1="210" y1="394" x2="210" y2="580" stroke-width="1.8" />
    <line x1="310" y1="394" x2="310" y2="580" stroke-width="1.8" />
    <line x1="410" y1="394" x2="410" y2="580" stroke-width="2" />
    
    <!-- Upper Level Glass Panels & Brise-Soleil (Vertical Louvers) -->
    <g stroke-width="0.75" opacity="0.7">
      <line x1="125" y1="400" x2="125" y2="455" />
      <line x1="140" y1="400" x2="140" y2="455" />
      <line x1="155" y1="400" x2="155" y2="455" />
      <line x1="170" y1="400" x2="170" y2="455" />
      <line x1="185" y1="400" x2="185" y2="455" />
      
      <line x1="225" y1="400" x2="225" y2="455" />
      <line x1="240" y1="400" x2="240" y2="455" />
      <line x1="255" y1="400" x2="255" y2="455" />
      <line x1="270" y1="400" x2="270" y2="455" />
      <line x1="285" y1="400" x2="285" y2="455" />
    </g>

    <!-- Lower Level Sliding Glass Frames -->
    <rect x="120" y="475" width="80" height="100" stroke-width="1.2" />
    <rect x="220" y="475" width="80" height="100" stroke-width="1.2" />
    <rect x="320" y="475" width="80" height="100" stroke-width="1.2" />

    <!-- Architectural Dimension Indicators & Elevation Callouts -->
    <line x1="50" y1="380" x2="50" y2="580" stroke-width="0.8" />
    <line x1="42" y1="380" x2="58" y2="380" stroke-width="1.2" />
    <line x1="42" y1="460" x2="58" y2="460" stroke-width="1.2" />
    <line x1="42" y1="580" x2="58" y2="580" stroke-width="1.2" />
    <text x="32" y="425" font-family="monospace" font-size="9" fill="#4A3425" stroke="none" transform="rotate(-90 32 425)">+3.60m</text>
    <text x="32" y="525" font-family="monospace" font-size="9" fill="#4A3425" stroke="none" transform="rotate(-90 32 525)">±0.00m</text>

    <!-- Floor Plan Grid Lines -->
    <circle cx="110" cy="610" r="8" fill="none" stroke-width="0.8" />
    <text x="110" y="613" font-family="monospace" font-size="8" fill="#4A3425" stroke="none" text-anchor="middle">A</text>
    <circle cx="210" cy="610" r="8" fill="none" stroke-width="0.8" />
    <text x="210" y="613" font-family="monospace" font-size="8" fill="#4A3425" stroke="none" text-anchor="middle">B</text>
    <circle cx="310" cy="610" r="8" fill="none" stroke-width="0.8" />
    <text x="310" y="613" font-family="monospace" font-size="8" fill="#4A3425" stroke="none" text-anchor="middle">C</text>
    <circle cx="410" cy="610" r="8" fill="none" stroke-width="0.8" />
    <text x="410" y="613" font-family="monospace" font-size="8" fill="#4A3425" stroke="none" text-anchor="middle">D</text>
  </g>

  <!-- CENTER-LEFT: High-Rise Tower Architectural Elevation Silhouette -->
  <g opacity="0.32" stroke-width="0.8">
    <!-- Slim Modernist Tower Silhouette (Trophy Penthouse Concept) -->
    <rect x="470" y="140" width="130" height="440" stroke-width="1.6" />
    <polygon points="460,140 610,140 535,90" fill="url(#diagHatch)" stroke-width="1.4" />
    
    <!-- Floor Levels Grids (20 Storeys) -->
    <line x1="470" y1="170" x2="600" y2="170" />
    <line x1="470" y1="200" x2="600" y2="200" />
    <line x1="470" y1="230" x2="600" y2="230" />
    <line x1="470" y1="260" x2="600" y2="260" />
    <line x1="470" y1="290" x2="600" y2="290" />
    <line x1="470" y1="320" x2="600" y2="320" />
    <line x1="470" y1="350" x2="600" y2="350" />
    <line x1="470" y1="380" x2="600" y2="380" />
    <line x1="470" y1="410" x2="600" y2="410" />
    <line x1="470" y1="440" x2="600" y2="440" />
    <line x1="470" y1="470" x2="600" y2="470" />
    <line x1="470" y1="500" x2="600" y2="500" />
    <line x1="470" y1="530" x2="600" y2="530" />
    <line x1="470" y1="560" x2="600" y2="560" />
    
    <!-- Vertical Curtain Wall Mullions -->
    <line x1="500" y1="140" x2="500" y2="580" stroke-width="0.6" stroke-dasharray="2,2" />
    <line x1="535" y1="140" x2="535" y2="580" stroke-width="1" />
    <line x1="570" y1="140" x2="570" y2="580" stroke-width="0.6" stroke-dasharray="2,2" />
  </g>

  <!-- TOP-RIGHT CORNER: Compass Rose & Scale Bar -->
  <g opacity="0.5" stroke="#4A3425">
    <!-- Compass Rose -->
    <circle cx="1520" cy="90" r="32" stroke-width="0.8" />
    <polygon points="1520,62 1526,90 1520,85 1514,90" fill="#4A3425" stroke="none" />
    <polygon points="1520,118 1524,90 1520,95 1516,90" fill="none" stroke-width="0.8" />
    <polygon points="1548,90 1520,96 1525,90 1520,84" fill="none" stroke-width="0.8" />
    <polygon points="1492,90 1520,84 1515,90 1520,96" fill="none" stroke-width="0.8" />
    <text x="1520" y="56" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#4A3425" stroke="none" text-anchor="middle">N</text>
    
    <!-- Graphic Metric Scale Bar -->
    <rect x="1440" y="145" width="130" height="5" stroke-width="0.8" fill="none" />
    <rect x="1440" y="145" width="32.5" height="5" fill="#4A3425" stroke="none" />
    <rect x="1505" y="145" width="32.5" height="5" fill="#4A3425" stroke="none" />
    <text x="1440" y="162" font-family="monospace" font-size="8" fill="#4A3425" stroke="none">0</text>
    <text x="1472.5" y="162" font-family="monospace" font-size="8" fill="#4A3425" stroke="none">5</text>
    <text x="1505" y="162" font-family="monospace" font-size="8" fill="#4A3425" stroke="none">10</text>
    <text x="1570" y="162" font-family="monospace" font-size="8" fill="#4A3425" stroke="none">20m</text>
    <text x="1505" y="174" font-family="'Cinzel', serif" font-size="7.5" letter-spacing="0.1em" fill="#4A3425" stroke="none" text-anchor="middle">SCALE 1:200</text>
  </g>
</svg>